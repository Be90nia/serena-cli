name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    # v0.2.0: 三平台。ls-runtime/lsp-core 的进程树治理已跨平台（Windows=Job Object
    # KILL_ON_JOB_CLOSE；Unix=进程组 setpgid(0,0) + killpg(SIGKILL)，linux 另挂
    # PR_SET_PDEATHSIG 父死兜底，macos 显式 kill——取舍见 ProcessTreeGuard 文档）。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
      # M0 CI 仅 windows 测试；linux host 全量测试在本 release 补跑——unix 侧
      # 进程组树治理（spawn_unix.rs）、跨平台 helper 由这里首验。
      - name: Test (linux host)
        if: runner.os == 'Linux'
        run: cargo test --workspace
        env:
          SERENA_SKIP_LS_E2E: "1"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "serena-cli-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/serena-cli.exe" -DestinationPath $out
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf "serena-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" serena-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: serena-cli-${{ matrix.target }}
          path: serena-cli-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: serena-cli ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/serena-cli-*
