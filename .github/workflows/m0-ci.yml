name: M0 CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # bd ljzc: 门禁从 windows 单平台扩到三平台——linux/macos 的 cfg 分支
    # （unix spawn、进程组治理）此前只有 release tag 时才首验。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89" # = rust-toolchain.toml（bd serena-rust-fc4i），防 stable 漂移
          # locate_finds_functional_rust_analyzer 探测真 rust-analyzer（rustup which
          # → --version 校验）；minimal profile 不含该组件，rustup proxy 会因组件
          # 缺失 --version 失败 → locate 链全落空。
          components: rust-analyzer
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --release
      - name: test
        run: cargo test --workspace
        env:
          # CI runner 的第三方 LS（clangd/LLVM 随 image 漂移）不做 e2e 门禁——
          # 真 LS e2e 由本地/nightly 真机覆盖（local/report-ls-smoke-*.md）。
          SERENA_SKIP_LS_E2E: "1"
      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          # name 带 runner.os——v4 同名二次上传即炸；path 通配 unix 无 .exe 后缀
          name: serena-cli-m0-${{ runner.os }}-${{ github.sha }}
          path: target/release/serena-cli*