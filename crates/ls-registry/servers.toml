# ---- npm / uvx 类别（机制已落地；真实条目数据由另一任务路由收录，此处仅格式示例）----
# 两类条目均不适用 exec/{bin} 模板：最终 cmd 由安装器/启动器返回。
#
# install = "npm"：安装期 `npm install --prefix {cache_root}/{id}/{version} <pkg>[@<ver>]`
#   （version 省略 = latest，缓存目录名 `latest`）；
#   启动 = {cache_root}/{id}/{version}/node_modules/.bin/<bin_rel>（Windows 取 .cmd shim）
#   + npm_args 追加参数。npm 不在 PATH → MissingRuntime。
# [servers.<id>]
# languages = ["..."]
# install = "npm"
# [servers.<id>.npm]
# package = "@scope/some-ls"   # 必填，非空
# version = "1.2.3"            # 可省
# bin_rel = "some-ls"          # 必填，node_modules/.bin/ 下相对名
# npm_args = ["--stdio"]       # 可省；追加在 bin 之后
#
# install = "uvx"：无安装步骤，launch = `uvx --from <pkg>[==<ver>] <entrypoint> <args>`
#   （version 省略 = 不锁版本）；uv 运行时自管缓存。
#   PATH 无 uvx → NotInstalled + 安装 hint。
# [servers.<id>]
# languages = ["..."]
# install = "uvx"
# [servers.<id>.uvx]
# package = "some-ls"          # 必填，非空
# version = "1.2.3"            # 可省
# entrypoint = "some-ls"       # 必填，非空
# args = ["--stdio"]           # 可省；追加在 entrypoint 之后

# ---- A 类 download 批量收录（Task 20 续；数据源 local/ls-download-matrix.md，25 条清单实收 24）----
# eclipse_jdtls 不入表：java 由手写 jdtls T2 适配器接管（同 gopls/rust-analyzer 先例）。
# 全部条目 = 上游 serena DEFAULT_*/INITIAL_* 钉住版本（pin），sha256 = 矩阵 [embed] 真值
# （GitHub 资产锚 assets[].digest，调研日期 2026-09-20）；source_commit 锚上游 43ae0211。
#
# 平台组策略（per-platform bin_path 扩展后）：url/sha256 走 *_per_platform 子表；
# 包内路径 bin_path 单值 = 默认（windows 组语义不变），平台互异路径填
# bin_path_per_platform 覆盖子表（key 同 url_per_platform；命中优先、miss 回退单值，
# 解析统一走 DownloadSpec::resolved_bin_path）。archive 仍单值——平台间压缩形态互异
# 的条目暂不存在；出现时按 bin_path_per_platform 同款扩展。既有条目其余平台的
# URL/sha256/包内路径保留在条目注释中，可直接搬运（ada 先例）。
# platform key：windows-x86_64 / windows-aarch64 / linux-x86_64 / linux-aarch64 /
# macos-x86_64 / macos-aarch64（= config::platform_key 输出全集）。

