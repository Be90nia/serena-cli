# 上游 fsharp_language_server.py L145：--tool-path 自有目录（非 -g），L188 启动开关组。
tool = "fsautocomplete"
version = "0.83.0"
args = ["--adaptive-lsp-server-enabled", "--project-graph-enabled", "--use-fcs-transparent-compiler"]

[servers.csharp_ls]
# 本地扩展条目（上游已迁 Roslyn，本地暂留 csharp-ls，见 local/csharp-ls-decision.md）；
# csharp 语言路由归 csharp（Roslyn）条目。无上游版本 pin → latest。
languages = ["csharp_ls"]
install = "dotnet"
[servers.csharp_ls.dotnet]
tool = "csharp-ls"

# ---- E 类 gem（2 条；要求 ruby + gem 在 PATH）----

[servers.ruby_lsp]
languages = ["ruby"]
install = "gem"
source_commit = "43ae0211"
[servers.ruby_lsp.gem]
# 上游 ruby_lsp.py RUBY_LSP_VERSION；裸启动（上游 ProcessLaunchInfo 无参数）。
gem = "ruby-lsp"
version = "0.26.8"
bin_rel = "ruby-lsp"

[servers.solargraph]
# ruby 语言路由归 ruby_lsp 条目，本条仅按 id 显式安装（避撞先例同 phpantom）。
languages = ["solargraph"]
install = "gem"
source_commit = "43ae0211"
[servers.solargraph.gem]
# 上游 solargraph.py installCommand: gem install solargraph -v 0.51.1；启动 `solargraph stdio`。
gem = "solargraph"
version = "0.51.1"
bin_rel = "solargraph"
args = ["stdio"]

# ---- F 类 source（2 条；要求构建工具链在 PATH；完整性锚 = pin，无产物级 sha256）----

[servers.nixd]
# 上游 nixd_ls.py 安装面 = nix-env/nix profile；本表以 flake 源码构建形态收录
# （clone + nix build 单步）。Windows 无 Nix 支持（上游同）。
languages = ["nix"]
install = "source"
source_commit = "43ae0211"
[servers.nixd.source]
repo = "https://github.com/nix-community/nixd"
build_cmd = ["nix", "build"]
bin_rel = "result/bin/nixd"

[servers.crystalline_source]
# crystalline 源码构建形态（任务示例：shards build；crystal 语言路由归 path_only 条目）。
# 无上游版本 pin → 默认分支；无 source_commit（非 serena 上游安装形态）。
languages = ["crystalline_source"]
install = "source"
[servers.crystalline_source.source]
repo = "https://github.com/elbywan/crystalline"
build_cmd = ["shards", "build", "--release"]
bin_rel = "bin/crystalline"
