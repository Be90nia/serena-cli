# ---- W3 批：scala（T0 接线，path_only 形态）。↖ mirror:
# scala_language_server.py@43ae021（上游 PATH 有 metals 则用之，否则 coursier
# bootstrap org.scalameta:metals_2.13；DEFAULT_METALS_VERSION = 1.6.4）。GitHub
# release 无预编译资产（v1.6.9 assets=[]，2026-09-29 查证）→ 与 G 类同类：只探测
# PATH，不自带安装器。CI 冒烟门用 coursier bootstrap 装到 /usr/local/bin（JDK 11+，
# runner 预装 17）。上游另应答 window/showMessageRequest 的 import 构建提示完成
# bloop 导入——我们 T0 不应答提示，无 build 工程的 fixture 走 metals standalone PC。

[servers.scala]
languages = ["scala"]
install = "path_only"
source_commit = "43ae0211"
[servers.scala.path_only]
binary_name = "metals"
install_hint = "bootstrap via coursier: cs bootstrap org.scalameta:metals_2.13:1.6.4 -o metals --java-opt -Xss4m (JDK 11+; upstream scala_language_server.py@43ae0211 DEFAULT_METALS_VERSION)"

# ---- W4 批：perl / r（G 类"exec 特殊待调研"两门收口：path_only + 运行时参数 exec）。
# 上游 G 类不托管安装（catalog §G61/§G63），T0 = 探测 PATH 解释器 + 镜像 launch argv；
# groovy 不入本表（上游 H 类用户自备 ls_jar_path JAR，无托管渠道，angular/java 先例）。

[servers.perl_ls]
# ↖ mirror perl_language_server.py@7a296833：launch 串
# `perl -MPerl::LanguageServer -e 'Perl::LanguageServer::run'`。Δ 上游适配器另应答
# workspace/configuration（perlInc/fileFilter）并补发 didChangeConfiguration——T0 走
# lsp-core 未注册请求默认 null 成功应答（kotlin 条目注释同源实锚），文件过滤回落
# LS 默认值。安装 = cpanm Perl::LanguageServer（apt cpanminus，--notest 跳测试套）。
languages = ["perl"]
extensions = [".pl", ".pm", ".t"]
install = "path_only"
exec = ["{bin}", "-MPerl::LanguageServer", "-e", "Perl::LanguageServer::run"]
[servers.perl_ls.path_only]
binary_name = "perl"
install_hint = "cpanm Perl::LanguageServer (apt install cpanminus; mirror perl_language_server.py@7a296833)"

[servers.r_ls]
# ↖ mirror r_language_server.py@7a296833：launch 串逐字
# `R --vanilla --quiet --slave -e "options(languageserver.debug_mode = FALSE); languageserver::run()"`。
# 安装 = CRAN languageserver 包（R 源码编译，runner 自带 gcc）；R runtime 不托管。
languages = ["r"]
extensions = [".r", ".rmd", ".rnw"]
install = "path_only"
exec = ["{bin}", "--vanilla", "--quiet", "--slave", "-e", "options(languageserver.debug_mode = FALSE); languageserver::run()"]
[servers.r_ls.path_only]
binary_name = "R"
install_hint = "R -e \"install.packages('languageserver')\" (apt install r-base-core; mirror r_language_server.py@7a296833)"

# ---- W5 批：julia（G 类"启动形态特殊"最后一门收口）+ wolfram（LICENSE SKIP 候选，
# 条目保留探测面）。gdscript/msl 不入本表（HOST SKIP 候选待 PM 裁决：godot 上游
# adapter 是 TCP 客户端连已运行编辑器 :6008、我们 TransportKind 仅 Stdio；msl 上游
# LS = serena 内嵌 pygls 脚本 [sys.executable, msl_lsp_server.py]，非独立发行）。

[servers.julia]
# ↖ mirror julia_server.py@7a296833：launch 串
# `julia --startup-file=no --history-file=no -e "using LanguageServer; runserver()" <repo_root>`。
# Δ 我们省略尾参 repo_root——runserver choose_env 回落链含 pwd 上溯（T0 spawn cwd =
# 项目根），无工程 fixture 回落默认全局 env，语义等价。Δ 上游另应答
# workspace/configuration（julia.lint.* 逐项 None）+ 补发 didChangeConfiguration——
# T0 走 lsp-core 未注册请求默认 null 成功应答（perl 条目注释同源实锚），lint 设置
# 回落 LS 默认，documentSymbol 底线不受影响。
# 首启依赖：julia runtime + LanguageServer.jl（手动
# `julia -e 'using Pkg; Pkg.add("LanguageServer")'` 一次；上游 _install_language_server
# 同款 300s 超时；CI 冒烟门在 install 行预装）。
languages = ["julia"]
extensions = [".jl"]
install = "path_only"
exec = ["{bin}", "--startup-file=no", "--history-file=no", "-e", "using LanguageServer; runserver()"]
[servers.julia.path_only]
binary_name = "julia"
install_hint = "install julia (https://julialang.org/downloads) then: julia -e 'using Pkg; Pkg.add(\"LanguageServer\")' (mirror julia_server.py@7a296833)"

[servers.wolfram]
# ↖ mirror wolfram_language_server.py@7a296833：launch
# [WolframKernel, "-noprompt", "-noinit", "-run", 'Needs["LSPServer`"];LSPServer`StartServer[]']。
# LS = WolframKernel 捆绑的 LSPServer paclet（Mathematica 13.0+ / Wolfram Engine
# 12.1+，无独立安装渠道——LICENSE SKIP 候选待 PM 裁决）；条目为持有 Wolfram 安装的
# 用户提供 PATH 探测 + 安装面（haskell_ls "运行时依赖自备"同款语义）。
# 上游发现顺序 WOLFRAM_PATH env → PATH → 常见安装位 glob——T0 只探 PATH（binary_name）。
languages = ["wolfram"]
extensions = [".wl", ".nb"]
install = "path_only"
exec = ["{bin}", "-noprompt", "-noinit", "-run", "Needs[\"LSPServer`\"];LSPServer`StartServer[]"]
[servers.wolfram.path_only]
binary_name = "WolframKernel"
install_hint = "install Wolfram Mathematica 13.0+ or Wolfram Engine 12.1+ (https://www.wolfram.com); the LSPServer paclet ships with it (mirror wolfram_language_server.py@7a296833)"
