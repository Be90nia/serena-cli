# （GitHub 资产锚 assets[].digest，调研日期 2026-09-20）；source_commit 锚上游 43ae0211。
#
# 平台组策略（schema 局限，per-platform 扩展前有效）：DownloadSpec.archive / bin_path
# 为单值字段，而多数 LS 的包内路径带 [.exe] / 平台段差异。每条只填 archive+bin_path
# 完全自洽的平台组（多组同大取含 windows-x86_64 的组，marksman 先例同形态），其余平台
# 的 URL/sha256/包内路径全量保留在条目注释中，schema 扩展后可直接搬运。
# platform key：windows-x86_64 / windows-aarch64 / linux-x86_64 / linux-aarch64 /
# macos-x86_64 / macos-aarch64（= config::platform_key 输出全集）。

