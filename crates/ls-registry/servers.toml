[servers.pgls]
# supabase-community/postgres-language-server（pgls，Rust）。LSP 入口是 `lsp-proxy`
# 子命令（裸跑 = CLI 帮助即退，非 stdio LS）。无 DB 连接时语法诊断可用（libpg_query
# 本地 parser，真机实测 broken.sql 推 2 条语法错）；documentSymbol/workspaceSymbol/
# definition 无 capability（符号层 hover 需 DB 连接 —— LS 能力边界，非接线缺陷）。
languages = ["pgsql"]
install = "download"
exec = ["{bin}", "lsp-proxy"]

