# smoke_langs.toml —— 45 门语言 CI 冒烟矩阵清单（Phase 0 基建，serena-rust）。
#
# 三栏对账锚（上游 73 门，详见 local/agent-reports/ci-infra-45lang.md）：
#   已收 64（本矩阵 45 真门 + 未入矩阵的表内/变体门）+ documented SKIP（angular，
#   PM 拍板三进程编排 T0 不支持）+ 剩余未收 8（perl/r/wolfram/gdscript/groovy/
#   julia/msl/scala）。总账 73 闭合。
#
# ── W1-W5 接入模板（加一门 = 两步）──────────────────────────────────────
# 1. 本清单加一个 [[lang]] 块（字段见下）；
# 2. scripts/smoke_fixtures/ 放一个最小 fixture（1 个具名符号，底线= documentSymbol 非空）。
# 分片/预算由 scripts/smoke_shard.py 按 budget_secs 自动加权装箱，无需手工排片。
#
# ── 字段 ──────────────────────────────────────────────────────────────
# id          serena 语言名（= LanguageId；install 与 --lang 同名，pgsql/mysql 等
#             变体门照 pgsql/mysql 先例走显式 --lang，不破 language_routes_are_unique）
# via         装法：serena-download | serena-npm | serena-uvx | serena-dotnet |
#             serena-gem | serena-source | npm | apt | rustup | go_install
#             （serena-* = `serena-cli install <id>`，pin 内嵌 servers.toml；
#             其他 = install 列完整 shell 命令，`$SERENA_CLI` 可引用二进制）
# install     完整 shell 命令；非空时优先于 via 默认装法执行（runtime apt 前置 +
#             `$SERENA_CLI install <id>` 连写；曾只认 via 默认装法，前置被静默跳过
#             —— bsl JVM 17 跑 21 的 LS 即此坑）
# pin         版本钉。apt 类一律 "suite"（禁版本号断言——suite 定版）；
#             serena-* 类写 "servers.toml"（唯一事实源，改表即改钉）
# fixture     scripts/smoke_fixtures/ 下文件名（rust 门为目录，带最小 Cargo.toml）
# budget_secs 单门预算（install+首启+探针全含）。超预算 → SKIP BUDGET（不红 CI，
#             打日志）；分片按此字段加权装箱
# extra_assert 加息探针（可选，登记制）：hover:LINE:COL | diagnostics。
#             底线（initialize+didOpen+documentSymbol 非空）恒跑，全门统一，
#             禁止为单门私造断言（PM 契约 #3）
# fallback_assert capability 边界降级探针（可选，登记制，Main 裁决 2026-09-29）：
#             LS 不实现 documentSymbol 的门才登记（diagnostics | hover:LINE:COL）；
#             触发降级 PASS 行标 (fallback:<kind>)，且跳过 extra_assert
# skip_*      SKIP 四类：LICENSE | PLATFORM | HOST | BUDGET；skip_evidence 必填
#             （一行证据：日志/平台事实/表条目位置）；SKIP 门强制 verified="never"
# remark      备注（扩展名冲突归属等）
#
# ── 扩展名冲突归属（PM 契约 #10）────────────────────────────────────────
# .yml/.yaml 归 yaml 门（ansible 走 --lang ansible）；.m 归 matlab（wolfram 仅
# .wl/.nb，wolfram 未入矩阵）；python 变体（pyright/basedpyright/ty/pyrefly）
# 共用 .py fixture + --lang 显式路由（pgsql/mysql 模式）。

