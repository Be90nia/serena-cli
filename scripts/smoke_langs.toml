#   本矩阵（R7 终账 2026-10-08）：74 门 = 62 真门 + 12 SKIP 冻结（R7 批 bd
#   serena-rust-8g4 复活 2：nextflow（did_change_config T0 通道落地，BUDGET SKIP
#   死因消失）/angular（angular.rs T2 三服务器编排 + npm 四包条目落地，HOST SKIP
#   死因消失））（crystal/
#   nix/elixir/fsharp/matlab/wolfram 存量 6 + langs20 批新收 4：angular/
#   groovy/gdscript/msl + R3/R5 回场 2：nextflow（didChangeConfiguration 注入缺口，
#   R7 复活）/qml（qmlls 两 strike 无 handler）+ R5 回场 1：al（裸 .al 休眠需 BC 工
#   程上下文，
#   install 链已全绿）。langs20 批六门 SKIP 转真门存活：java（Adoptium JRE 25 +
#   alternatives）、bsl（update-alternatives 切 21）、haskell（HLS 2.15.0.0 配对
#   runner ghcup GHC 9.14.1 + 版本配对断言）、latex（texlab 单二进制裸 .tex 即出
#   符号）、pascal（apt fpc + 条目补 linux 组 + fixture unit 形态）、omnisharp（条目
#   补 linux net6 tar.gz 原生 apphost）、swift（swift.org tarball 自举），luau 新收
#   真门。
#   CI 轮次账：R1 run 36649455255 = 57 PASS/10 SKIP/7 FAIL（al/haskell/nextflow/
#   omnisharp/pascal/qml/swift）→ R2 run 36653605574 = 59/11/4（al/haskell/pascal/
#   qml）→ R3 run 36657710307 = 59/12/3（al/haskell/pascal，qml 已 SKIP）→ R4 run
#   36659777378 = 60/12/2（pascal fixture unit 形态转绿；余 al/haskell）→ R5 = 终局
#   轮（al 转 SKIP、haskell HLS 配对断言 61/13）→ R6（2ace364）：haskell 后端存在性断言修通入探针、spawn 静默死（crystal 同签名）转 SKIP，终局 = 60/14/0 目标。逐门证据见各块
#   remark。
#   前账：R7 终账 2026-09-29 = 69 门 = 53 真门 + 16 SKIP 冻结（R6 证据 SKIP 7：
#   bsl/crystal/elixir/nextflow/fsharp/haskell/qml，run 36577226543 帧级实锚）；
#   R6 = smoke 终轮（run 36577226543 12 红门处置）。矩阵外仅 sql/mysql（documented
#   SKIP，见尾部对账节）。
#   ── 平台分类（bd serena-rust-2p5，压测三平台 2026-09-30）────────────────────
#   linux 门数与分片不变（74 = 60 真门 + 14 SKIP；14 证据 SKIP 门三平台维持原
#   SKIP 输出）。60 真门三类（逐门证据 = local/agent-reports/stress-harness.md）：
#   a 类 portable-as-is 31 门（serena-npm/uvx/download 三平台资产 + npm/go/dotnet/
#   rustup 生态装法 + windows Rustup/Ruby/Python 预装——runner Readme 实锚）；
#   b 类 14 门补 install_windows/install_macos 平台行（cpp/bsl/java/haxe/zig/scala/
#   lean4/gleam/julia + swift/clojure/pascal/r/ruby 单平台行）——全部一手取证
#   （GitHub assets[].digest / ziglang index.json / julialang-s3 versions.json /
#   runner-images Readme / homebrew-core formula）；c 类 15 门无平台资产或装法超重
#   → install_windows|install_macos = "SKIP"（该平台 SKIP PLATFORM 输出不红）。
#   runner 事实锚 = actions/runner-images images/{macos/macos-15-arm64,
#   windows/Windows2025}-Readme.md（Rustup 1.29/PowerShell 7.6/R 4.6.1/Ruby 3.3/
#   Python 3.12+3.14/JAVA_HOME_21+25 双平台预装）。
#   runner_remark（bd serena-rust-kwva，linux 侧版本账）：linux 门跑 ubuntu-24.04
#   （stress-ls.yml / ls-smoke.yml 硬 pin；镜像漂移会破上面的门分类锚，升 pin 前
#   先对账 runner-images Readme）；m0-ci.yml 门禁用 ubuntu-latest（随 GitHub 漂移，
#   2026-10 时点 = 24.04，仅 cargo test 门禁无门分类依赖，允许漂）。
#   ── W1-W5 接入模板（加一门 = 两步）──────────────────────────────────────
# 1. 本清单加一个 [[lang]] 块（字段见下）；
# 2. scripts/smoke_fixtures/ 放一个最小 fixture（1 个具名符号，底线= documentSymbol 非空）。
# 分片/预算由 scripts/smoke_shard.py 按 budget_secs 自动加权装箱，无需手工排片。
#
# ── 字段 ──────────────────────────────────────────────────────────────
# id          serena 语言名（= LanguageId；install 与 --lang 同名，pgsql/mysql 等
#             变体门照 pgsql/mysql 先例走显式 --lang，不破 language_routes_are_unique）
# via         装法：serena-download | serena-npm | serena-uvx | serena-dotnet |
#             serena-gem | serena-source | npm | apt | rustup | go_install | binary
#             （serena-* = `serena-cli install <id>`，pin 内嵌 servers.toml；
#             binary = release 单二进制/官方 tarball curl 落地 PATH，W4 批新增——
#             非 serena-* via 统一走 install 完整 shell 命令分支，执行器零改动；
#             其他 = install 列完整 shell 命令，`$SERENA_CLI` 可引用二进制）
# install     完整 shell 命令；非空时优先于 via 默认装法执行（runtime apt 前置 +
#             `$SERENA_CLI install <id>` 连写；曾只认 via 默认装法，前置被静默跳过
#             —— bsl JVM 17 跑 21 的 LS 即此坑）
# pin         版本钉。apt 类一律 "suite"（禁版本号断言——suite 定版）；
#             serena-* 类写 "servers.toml"（唯一事实源，改表即改钉）
# fixture     scripts/smoke_fixtures/ 下文件名（rust 门为目录，带最小 Cargo.toml）
# budget_secs 单门预算（install+首启+探针全含）。超预算 → SKIP BUDGET（不红 CI，
#             打日志）；分片按此字段加权装箱
# extra_assert 加息探针（可选，登记制）：hover:LINE:COL | diagnostics。
#             底线（initialize+didOpen+documentSymbol 非空）恒跑，全门统一，
#             禁止为单门私造断言（PM 契约 #3）
# fallback_assert capability 边界降级探针（可选，登记制，Main 裁决 2026-09-29）：
#             LS 不实现 documentSymbol 的门才登记（diagnostics | hover:LINE:COL）；
#             触发降级 PASS 行标 (fallback:<kind>)，且跳过 extra_assert
# skip_*      SKIP 四类：LICENSE | PLATFORM | HOST | BUDGET；skip_evidence 必填
#             （一行证据：日志/平台事实/表条目位置）；SKIP 门强制 verified="never"
# remark      备注（扩展名冲突归属等）
#
# ── 扩展名冲突归属（PM 契约 #10）────────────────────────────────────────
# .yml/.yaml 归 yaml 门（ansible 走 --lang ansible）；.m 归 matlab（wolfram 仅
# .wl/.nb，wolfram 未入矩阵）；python 变体（pyright/basedpyright/ty/pyrefly）
# 共用 .py fixture + --lang 显式路由（pgsql/mysql 模式）。

