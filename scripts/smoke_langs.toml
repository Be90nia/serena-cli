# sql / mysql：PM 追认 documented SKIP（2026-09-29 smoke 修红轮）——sqls 源码
#          internal/handler/handler.go:148-168 实锚 capabilities 无
#          DocumentSymbolProvider、无 diagnostics；无 DB 连接时 hover 内容恒空
#          （[servers.sql] 条目注释 2026-09-28 真机实测同源）。底线三断言全依赖
#          "无 DB 也有内容"假设，唯一真输出 formatting 不在探针词表（契约 #3 禁
#          单门私造）。coverage 标 install-verified / probe-infeasible(no DB)；
#          servers.toml 条目保留（linux install 已修，install/doctor 可用）。若用户
#          配置 sqls DB 连接，可手动 probe 解锁真门（未来可选增强，非 smoke scope）。
# perl/r/wolfram/gdscript/groovy/julia/msl/scala：未收门（上游 G/H 类形态特殊），
#          W 波次按需评估；julia 首启装包走 BUDGET 预算机制模板。
