[[lang]]
id = "bsl"
via = "serena-download"
install = "sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jre-headless && sudo update-alternatives --set java \"$(update-alternatives --list java | grep -m1 java-21)\" && java -version 2>&1 | head -1 >&2 && $SERENA_CLI install bsl"
pin = "servers.toml"
fixture = "module.bsl"
lang_flag = "bsl"
budget_secs = 600
remark = "langs20 轮转真门：R6 死因 = apt 装了 21 但 alternatives 默认仍指 17，lazy-spawn daemon 的 LS spawn 解析 java 落 17（run 36577226543 UnsupportedClassVersionError 65.0 vs 61.0 实锚）——apt 前置装 21 后必须 update-alternatives --set 切系统软链（install 子 shell 的 PATH/export 不回传 daemon，系统态才是传导面，java 门同源）；java -version 打印留 install.out 作 21 在场证据；stress 平台行 = JAVA_HOME_21_{X64,arm64} 前插 daemon PATH（runner 预装 Temurin 21/25 双版本，Windows2025/macos-15-arm64 Readme 实锚）——$SERENA_EXTRA_ENV 文件中转由 smoke_one.sh source，即 update-alternatives 系统态传导的跨平台等价物"
install_windows = "JB=$(cygpath -u \"$JAVA_HOME_21_X64\")/bin && echo \"export PATH=\\\"$JB:\\$PATH\\\"\" > \"$SERENA_EXTRA_ENV\" && . \"$SERENA_EXTRA_ENV\" && java -version 2>&1 | head -1 >&2 && $SERENA_CLI install bsl"
install_macos = "echo \"export PATH=\\\"$JAVA_HOME_21_arm64/bin:\\$PATH\\\"\" > \"$SERENA_EXTRA_ENV\" && . \"$SERENA_EXTRA_ENV\" && java -version 2>&1 | head -1 >&2 && $SERENA_CLI install bsl"

